# Local connections inside the PostgreSQL container
local   all       all                                      trust

# Local TCP connections
host    all       all       127.0.0.1/32                   scram-sha-256
host    all       all       ::1/128                        scram-sha-256

# FragVault backend container
host    xorvault  xoruser   172.16.0.0/12                  scram-sha-256

# Kali live-demo restricted vault accounts
# FragVault restricted live-demo users
hostnossl xorvault vault_a_reader 0.0.0.0/0                scram-sha-256
hostnossl xorvault vault_b_reader 0.0.0.0/0                scram-sha-256
hostnossl xorvault vault_c_reader 0.0.0.0/0                scram-sha-256
